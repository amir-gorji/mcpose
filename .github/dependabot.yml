version: 2

# Batched, not one PR per dependency: see AGENTS.md "Dependabot automation"
# and #189. Majors get their own PR; the limit of 2 keeps the routine batch
# from starving behind a majors PR nobody is ready to make a call on.
#
# A major the repository has decided not to take yet goes in an `ignore`
# rule here, never in a pnpm-workspace.yaml override cap (#105). `ignore` is
# evaluated before `groups`, so grouping cannot smuggle it into a batch.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-major:
        patterns:
          - '*'
        update-types:
          - 'major'
  # Stays on the automated review lane, unlike a repo whose review workflow
  # triggers on pull_request: dependabot-review.yml runs via
  # pull_request_target from main, so a batch that bumps an action used
  # inside that workflow is still reviewed by the version already on main.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
