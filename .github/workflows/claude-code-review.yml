name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Dependabot PRs are excluded on purpose. This action refuses to run for
    # a non-human actor unless that bot is in `allowed_bots`, and it fails
    # the job rather than skipping it, so without this condition a dependabot
    # PR carries a red `claude-review` whenever dependabot itself pushed the
    # last commit. Those PRs get their own reviewer in dependabot-review.yml,
    # which opts dependabot in explicitly, so allowing it here too would only
    # double-review them.
    #
    # Fork PRs are excluded too (#190): GitHub runs pull_request for a fork
    # with no OIDC token and no secrets, so the action cannot authenticate
    # and the job fails on every external contribution. pull_request_target
    # would fix that by handing this agent secrets over untrusted fork code,
    # which is the wrong trade. Ask for a fork review with @claude instead
    # (claude.yml runs in the base repository's context).
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@2261fcfc88e7de1b55f179edd588805e12de71f2 # v1.0.228
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
