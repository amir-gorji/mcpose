name: Dependabot Merge

# Merges a dependabot PR once mcpose CI (build/lint/test/gitleaks/osv-scan)
# is green on it and dependabot-review.yml has labeled it
# auto-merge-approved. Triggers cover every ordering of "review labels it"
# vs "CI finishes":
#   - workflow_run on mcpose CI: CI finishes after the label was applied.
#   - workflow_run on Dependabot Review: the review completes strictly
#     after its own labeling, so this path closes the ordering gap where CI
#     finished first AND the labeled event below cannot fire (#142): the
#     review labels via GITHUB_TOKEN, and GitHub suppresses workflow
#     triggers for events authored by a workflow token.
#   - pull_request/labeled: harmless extra path for a human-applied label.
# Either way this checks mcpose CI's actual current check status before
# merging, rather than trusting a specific run's payload.

on:
  workflow_run:
    workflows: ['mcpose CI', 'Dependabot Review']
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' ||
        github.event.workflow_run.event == 'pull_request_target') &&
       github.event.workflow_run.pull_requests[0]) ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'auto-merge-approved' &&
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve PR number
        id: number
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.pull_requests[0].number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.number.outputs.value }}
          REPO: ${{ github.repository }}
        run: |
          # `gh pr view --json author` returns bot logins as "app/dependabot"
          # (a gh CLI quirk), not "dependabot[bot]" as the REST API and the
          # Actions webhook payload do. Use the REST API here so this
          # actually matches.
          AUTHOR=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.user.login')
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER is not a dependabot PR, skipping."
            exit 0
          fi

          LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')
          if ! echo "$LABELS" | jq -e 'index("auto-merge-approved")' > /dev/null; then
            echo "PR #$PR_NUMBER is not labeled auto-merge-approved, skipping."
            exit 0
          fi

          # mcpose CI's own checks must all be green on the PR's current
          # head. Checked by name so an unrelated/self check (this workflow,
          # the Claude review job, claude-code-review.yml) never gates this.
          CHECKS=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,bucket)
          for name in 'ci (20)' 'ci (22)' 'ci (24)' 'gitleaks' 'osv-scan'; do
            bucket=$(echo "$CHECKS" | jq -r --arg n "$name" '.[] | select(.name == $n) | .bucket')
            if [ "$bucket" != "pass" ]; then
              echo "Check '$name' is '${bucket:-missing}', not pass yet. Skipping; another trigger will retry once it is."
              exit 0
            fi
          done

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
