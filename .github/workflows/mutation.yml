name: mutation

# Not a cron lane. A nightly run re-mutates unchanged code for no new
# information, and GitHub disables schedules on quiet repositories. Every run
# here follows a change that can actually move the score, plus manual dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'packages/audit/**'
      - 'packages/core/**'
      - 'packages/*/stryker.config.mjs'
      - '.github/workflows/mutation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      # Stryker only re-tests mutants whose code changed since the cached run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/audit/.stryker-tmp/incremental.json
          key: stryker-audit-${{ github.sha }}
          restore-keys: stryker-audit-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/.stryker-tmp/incremental.json
          key: stryker-core-${{ github.sha }}
          restore-keys: stryker-core-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @mcpose/audit mutation
      # Report both scores even when the first package breaks its threshold.
      - if: ${{ !cancelled() }}
        run: pnpm --filter mcpose mutation
