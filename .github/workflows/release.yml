# Publishes a package when its release tag is pushed, with npm provenance.
#
# Tag formats (matching existing repo history):
#   vX.Y.Z                    -> publishes mcpose (core)
#   @mcpose/<name>@X.Y.Z      -> publishes @mcpose/<name>, for any workspace
#                                package under that scope
#
# The version in the tag must equal the version in that package's
# package.json, so a tag can never publish a build it does not describe.
#
# Authentication: npm trusted publishing (OIDC) through the id-token
# permission below. pnpm 11.0.7 or newer prefers OIDC over a static token
# (https://github.com/pnpm/pnpm/releases/tag/v11.0.7), so once a package
# lists this repository and workflow as its trusted publisher on npmjs.com,
# the token on the publish step is ignored for it.
#
# A trusted publisher is configured in a package's settings page, which only
# exists once the package has been published. The first publish of a new
# package therefore needs an NPM_TOKEN repository secret: a granular access
# token with publish rights on the @mcpose scope and 2FA bypass. Set it,
# push the tag, add the trusted publisher on npmjs.com, then delete the
# secret. When the secret is absent, NODE_AUTH_TOKEN is empty, pnpm sends
# no static credential, and a package without a trusted publisher fails
# loudly at the publish step rather than silently doing nothing.
name: release

on:
  push:
    tags:
      - 'v*'
      - '@mcpose/*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build ts:ci test
      - name: Resolve package filter from tag
        id: pkg
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            @mcpose/*@*) FILTER="${TAG%@*}"; VERSION="${TAG##*@}" ;;
            v*)          FILTER="mcpose";    VERSION="${TAG#v}" ;;
            *) echo "Unrecognized tag: $TAG" >&2; exit 1 ;;
          esac
          ACTUAL="$(pnpm --filter "$FILTER" exec node -p 'require("./package.json").version')"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "Tag $TAG names version $VERSION but $FILTER is at $ACTUAL" >&2
            exit 1
          fi
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
      - run: pnpm publish --access public --provenance --no-git-checks --filter ${{ steps.pkg.outputs.filter }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
